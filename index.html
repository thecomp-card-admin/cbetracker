<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Career Best Effort lifting tracker: one small step past your best every session.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CBE">
  <title>CBE Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="main" class="wrap no-tabs"><div class="boot">Loading…</div></main>
  <nav id="nav" class="tabbar" aria-label="Sections" hidden></nav>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="confirm" class="sheet" role="alertdialog" aria-modal="true" style="z-index:40" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p style="padding:24px">CBE Tracker needs JavaScript.</p></noscript>
</body>
</html>
